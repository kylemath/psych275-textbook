<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PSYCH 275 — Brain and Behaviour</title>
    <meta name="description" content="Course readings for PSYCH 275 Brain and Behaviour.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Spectral:wght@600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0b0f17;
        --text: #e6edf3;
        --muted: #9fb0c3;
        --accent: #7ae1ff;
      }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(1000px 700px at 20% 10%, #0e1522 0%, var(--bg) 55%, #060a11 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
      }
      main {
        max-width: 36rem;
        padding: 32px 24px;
        text-align: center;
      }
      .brand {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px;
      }
      h1 {
        font-family: Spectral, Georgia, serif;
        font-size: clamp(28px, 5vw, 40px);
        font-weight: 700;
        line-height: 1.2;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 28px;
      }
      a.textbook {
        display: inline-block;
        padding: 12px 22px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a.textbook:hover {
        background: rgba(122, 225, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">PSYCH 275 — Brain and Behaviour</p>
      <h1>Brains, Minds, and Machines</h1>
      <p>The assigned reading for this course is the textbook.</p>
      <a class="textbook" href="./textbook/">Open the textbook</a>
    </main>
  </body>
</html>
